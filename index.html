<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="author" content="Echo Reid">
    <title>The Loot System</title>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <script src="javascript/lootStorer.js" defer></script>
  </head>
  <body>
    <!--Two text entries-->
    <div>
        <input type="text" id="nameInput" placeholder="Enter loot name">
        <input type="number" id="valueInput" placeholder="Enter loot value">
    </div>
    <!--Submit button-->
    <div>
      <button id="submitButton">Add Loot.</button>
      <p id="validationMessage"> </p>
    </div>
    <!--Display messages-->
    <div id="lootDisplay">
      <p id="lootValue">Total value of all loot: 0</p>
    </div>
  </body>
</html>
